# Instalador do Lúmen OS (Calamares). Instalado em /etc/calamares na ISO.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: kernel
    module: shellprocess
    config: shellprocess-kernel.conf
  - id: limpeza
    module: shellprocess
    config: shellprocess-limpeza.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@kernel
      - shellprocess@limpeza
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - umount
  - show:
      - finished

branding: lumen
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
