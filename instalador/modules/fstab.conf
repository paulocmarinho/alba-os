---
crypttabOptions: luks
tmpOptions:
  default: false
  ssd: true
mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
