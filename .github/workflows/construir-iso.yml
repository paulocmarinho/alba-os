name: Construir ISO do Alba

on:
  workflow_dispatch:
  push:
    tags:
      - "iso-v*"

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar espaço no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar o Sleeve (player de música)
        run: git clone --depth 1 https://github.com/paulocmarinho/sleeve web/sleeve-src

      - name: Montar a interface
        working-directory: web
        run: |
          mkdir -p public/fonts
          curl -fsSL --retry 3 -o public/fonts/DMSans.ttf \
            "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf" || echo "Sem DM Sans; a interface usa a fonte padrão."
          npm install --no-audit --no-fund
          npm run build
          test -f dist/apps/sleeve/index.html
          ls -la dist dist/fonts || true

      - name: Testar o servidor do sistema
        run: python3 -m py_compile servidor/alba_servidor.py servidor/pam.py servidor/musica.py servidor/loja.py servidor/rede.py servidor/notificacoes.py servidor/busca.py servidor/monitor.py servidor/apps.py

      - name: Identificar a compilação
        run: |
          SV="$(grep -oP '(?<=<Version>)[^<]+' web/sleeve-src/src/windows/Sleeve.csproj || echo '')"
          printf '{"versao": "%s", "commit": "%s", "data": %s, "numero": 0, "sleeve": {"versao": "%s", "commit": "%s"}}\n' "$(cat VERSAO)" "$GITHUB_SHA" "$(git log -1 --format=%ct)" "$SV" "$(git -C web/sleeve-src rev-parse HEAD)" > compilacao.json
          cat compilacao.json

      - name: Montar a ISO num contêiner Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$PWD:/alba" -w /alba \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Syu --noconfirm --needed archiso
              bash ./iso/construir-iso.sh /alba/saida
              chown -R '"$(id -u):$(id -g)"' /alba/saida
            '
          ls -lh saida

      - name: Gerar soma SHA-256
        run: cd saida && sha256sum *.iso > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Disponibilizar a ISO para download
        uses: actions/upload-artifact@v4
        with:
          name: alba-os-iso
          path: |
            saida/*.iso
            saida/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
