name: Testar sessão gráfica

# Roda a sessão do Alba num compositor sem tela (headless) e tira fotos da tela.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de teste"
        default: "testes/sonda.sh"

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Pacotes
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm labwc gtk4-layer-shell webkitgtk-6.0 python-gobject python-pywayland wlr-protocols grim wlr-randr foot ttf-dejavu noto-fonts mesa python-cairo xorg-xwayland firefox python-mutagen playerctl
      - uses: actions/checkout@v4
      - name: Rodar
        run: bash "${{ inputs.script }}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: saida/
