name: Testar sessão gráfica

# Roda a sessão do Alba num compositor sem tela (headless) e tira fotos da tela.
on:
  push:
    branches: [compositor]
  workflow_dispatch:
    inputs:
      script:
        description: "Script de teste"
        default: "testes/casca.sh"
      ambiente:
        description: "Variáveis extras (ex.: GSK_RENDERER=cairo)"
        default: ""
      ramo:
        description: "Ramo das capturas"
        default: "testes-capturas"

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Pacotes
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm labwc gtk4-layer-shell webkitgtk-6.0 python-gobject python-pywayland wlr-protocols grim wlr-randr foot ttf-dejavu noto-fonts inter-font mesa python-cairo xorg-xwayland firefox python-mutagen playerctl libcap python-cairo xorg-xwayland adwaita-icon-theme adwaita-cursors wtype dbus curl firefox-i18n-pt-br flatpak pacman-contrib fakeroot
          setcap -r /usr/bin/labwc || true
      - uses: actions/checkout@v4
      - name: Interface
        run: |
          git clone --depth 1 https://github.com/paulocmarinho/sleeve web/sleeve-src
          cd web && npm install --no-audit --no-fund && npm run build
      - name: Rodar
        env:
          ALBA_AMBIENTE: ${{ inputs.ambiente }}
        run: bash "${{ inputs.script || 'testes/casca.sh' }}" || true
      - name: Publicar capturas no ramo testes-capturas
        if: always()
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "alba-testes"; git config user.email "alba-testes@users.noreply.github.com"
          rm -rf /tmp/cap && cp -r saida /tmp/cap
          git checkout --orphan "${{ inputs.ramo || 'testes-capturas' }}"
          git rm -rfq . >/dev/null
          rm -rf ./* && cp -r /tmp/cap/. .
          git add -A && git commit -qm "Capturas $GITHUB_SHA" && git push -f origin "${{ inputs.ramo || 'testes-capturas' }}"
