name: Testar sessão gráfica

# Roda a sessão do Alba num compositor sem tela (headless) e tira fotos da tela.
on:
  push:
    branches: [compositor]
  workflow_dispatch:
    inputs:
      script:
        description: "Script de teste"
        default: "testes/sonda.sh"

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Pacotes
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm labwc gtk4-layer-shell webkitgtk-6.0 python-gobject python-pywayland wlr-protocols grim wlr-randr foot ttf-dejavu noto-fonts mesa python-cairo xorg-xwayland firefox python-mutagen playerctl libcap
          setcap -r /usr/bin/labwc || true
      - uses: actions/checkout@v4
      - name: Rodar
        run: bash "${{ inputs.script || 'testes/sonda.sh' }}" || true
      - name: Publicar capturas no ramo testes-capturas
        if: always()
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "alba-testes"; git config user.email "alba-testes@users.noreply.github.com"
          rm -rf /tmp/cap && cp -r saida /tmp/cap
          git checkout --orphan testes-capturas
          git rm -rfq . >/dev/null
          rm -rf ./* && cp -r /tmp/cap/. .
          git add -A && git commit -qm "Capturas $GITHUB_SHA" && git push -f origin testes-capturas
