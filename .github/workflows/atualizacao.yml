name: Publicar atualização do Alba

# A cada mudança na main, monta um pacote pequeno com a interface, o servidor e a sessão
# do Alba e publica como "release" no GitHub. O Alba instalado baixa por Ajustes › Sobre.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "iso/pacotes.txt"
      - "testes/**"
  workflow_dispatch:
  # O Sleeve mora em outro repositório: de 3 em 3 horas, se ele mudou, sai um pacote novo.
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: atualizacao
  cancel-in-progress: false

jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar o Sleeve (player de música)
        run: git clone --depth 1 https://github.com/paulocmarinho/sleeve web/sleeve-src

      - name: Ver se há o que publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLEEVE_COMMIT="$(git -C web/sleeve-src rev-parse HEAD)"
          SLEEVE_VERSAO="$(grep -oP '(?<=<Version>)[^<]+' web/sleeve-src/src/windows/Sleeve.csproj || echo '')"
          echo "SLEEVE_COMMIT=$SLEEVE_COMMIT" >> "$GITHUB_ENV"
          echo "SLEEVE_VERSAO=$SLEEVE_VERSAO" >> "$GITHUB_ENV"
          SEGUIR=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PUBLICADO="$(gh release download -R "$GITHUB_REPOSITORY" -p compilacao.json -O - 2>/dev/null | python3 -c 'import json,sys; print((json.load(sys.stdin).get("sleeve") or {}).get("commit",""))' || true)"
            [ "$PUBLICADO" = "$SLEEVE_COMMIT" ] && SEGUIR=0
            echo "Sleeve publicado: $PUBLICADO; atual: $SLEEVE_COMMIT; publicar: $SEGUIR"
          fi
          echo "SEGUIR=$SEGUIR" >> "$GITHUB_ENV"

      - name: Montar a interface
        if: env.SEGUIR == '1'
        working-directory: web
        run: |
          mkdir -p public/fonts
          curl -fsSL --retry 3 -o public/fonts/DMSans.ttf \
            "https://github.com/google/fonts/raw/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf" || echo "Sem DM Sans; a interface usa a fonte padrão."
          npm install --no-audit --no-fund
          npm run build
          test -f dist/apps/sleeve/index.html

      - name: Testar os scripts
        if: env.SEGUIR == '1'
        run: |
          python3 -m py_compile servidor/alba_servidor.py servidor/pam.py servidor/musica.py
          for f in sistema/alba-sessao sistema/alba-atualizar sistema/instalar.sh sistema/montar-arquivos.sh iso/construir-iso.sh; do bash -n "$f"; done

      - name: Identificar a compilação
        if: env.SEGUIR == '1'
        run: |
          VERSAO="$(cat VERSAO)"
          DATA="$(git log -1 --format=%ct)"
          [ "${{ github.event_name }}" = "schedule" ] && DATA="$(date +%s)"  # pacote novo só por causa do Sleeve
          printf '{"versao": "%s", "commit": "%s", "data": %s, "numero": %s, "sleeve": {"versao": "%s", "commit": "%s"}}\n' "$VERSAO" "$GITHUB_SHA-$GITHUB_RUN_NUMBER" "$DATA" "$GITHUB_RUN_NUMBER" "$SLEEVE_VERSAO" "$SLEEVE_COMMIT" > compilacao.json
          cat compilacao.json
          echo "TAG=alba-$VERSAO-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Montar o pacote
        if: env.SEGUIR == '1'
        run: |
          RAIZ_PACOTE="$(mktemp -d)"
          bash sistema/montar-arquivos.sh "$RAIZ_PACOTE"
          mkdir -p saida
          tar --owner=0 --group=0 --numeric-owner -czf saida/alba-atualizacao.tar.gz -C "$RAIZ_PACOTE" usr etc
          cp compilacao.json saida/
          (cd saida && sha256sum alba-atualizacao.tar.gz > alba-atualizacao.tar.gz.sha256)
          ls -lh saida
          tar -tzf saida/alba-atualizacao.tar.gz | head -40

      - name: Publicar
        if: env.SEGUIR == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" saida/* \
            --title "Alba OS $(cat VERSAO) (compilação $GITHUB_RUN_NUMBER)" \
            --notes "$(git log -1 --format=%B)" \
            --latest
